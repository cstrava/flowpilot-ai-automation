services:
  backend:
    build:
      context: ./server
    container_name: flowpilot-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: flowpilot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped